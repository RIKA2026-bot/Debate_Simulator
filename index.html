<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debate Coach AI | אימון אישי</title>
    <style>
        :root {
            --bg-color: #faf8f5;
            --accent-color: #8c7851;
            --text-color: #4a4a4a;
            --card-bg: #ffffff;
            --border-color: #e0d7c6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 2rem 0;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin: 0;
            color: var(--accent-color);
        }

        .container {
            max-width: 800px;
            width: 90%;
            margin-top: 3rem;
            text-align: center;
        }

        .mic-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 2rem;
            cursor: pointer;
        }

        .mic-circle {
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .mic-circle:hover {
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        .mic-circle.active {
            border-color: #e67e22;
            box-shadow: 0 0 20px rgba(230, 126, 34, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .status-text {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .topic-card {
            background: var(--card-bg);
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .topic-card:hover {
            background: var(--bg-color);
            border-color: var(--accent-color);
        }

        .feedback-area {
            margin-top: 3rem;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            display: none; /* יוצג רק בסוף */
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<header>
    <h1>DEBATE COACH AI</h1>
</header>

<div class="container">
    <div class="mic-container" id="micBtn">
        <div class="mic-circle">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
        </div>
    </div>

    <div class="status-text" id="status">לחצי על המיקרופון כדי להתחיל בדיבייט</div>

    <div class="topics-grid">
        <div class="topic-card">בינה מלאכותית במקום בגרויות</div>
        <div class="topic-card">הורדת גיל הבחירה ל-16</div>
        <div class="topic-card">יום בשבוע ללא מסכים</div>
        <div class="topic-card">לימודים במטאוורס</div>
        <div class="topic-card">חובת שירות לאומי לכולם</div>
    </div>

    <div class="feedback-area" id="feedback">
        <h3>סיכום ומשוב פדגוגי</h3>
        <div id="feedbackContent"></div>
    </div>
</div>

<script>
    const API_KEY = 'AIzaSyBuVEEE5JLA48o6AMvM1JAy-TB2reAfoqw'; // המפתח שלך כבר כאן
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('status');

    let isActive = false;

    micBtn.addEventListener('click', () => {
        isActive = !isActive;
        if (isActive) {
            micBtn.querySelector('.mic-circle').classList.add('active');
            statusText.innerText = "המאמן מקשיב... דברי עכשיו";
            // כאן תבוא הלוגיקה של ה-Live API ששמרנו ב-TS
        } else {
            micBtn.querySelector('.mic-circle').classList.remove('active');
            statusText.innerText = "השיחה הושהתה";
        }
    });
</script>

</body>
</html>
